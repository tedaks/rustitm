name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly, 1.56.0]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/index
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --all-features --verbose

      - name: Run cargo check
        run: cargo check --all-targets --all-features --verbose

      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run cargo fmt check
        run: |
          cargo fmt --all -- --check
          cargo fmt --all -- --check # verify idempotent

  rustitm_test:
    name: Test rustitm against NTIA reference vectors
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NTIA/itm
          path: itm_reference

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-rustitm-test-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Copy reference CSVs
        run: |
          cp itm_reference/area.csv area.csv
          cp itm_reference/cmd_examples/pfl.txt itm_reference/cmd_examples/pfl.txt
        working-directory: rustitm

      - name: Run rustitm tests
        run: cargo test --test reference
        working-directory: rustitm

  doc:
    name: Doc check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run cargo doc
        run: cargo doc --no-deps --all-features --verbose

  msrv:
    name: MSRV check (1.56.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.56.0

      - name: Cargo check
        run: cargo check --all-targets --verbose

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
